<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>U24 · Buscador de ubicaciones</title>
<meta name="description" content="Buscador de ubicaciones del operativo sanitario U24.">
<meta name="theme-color" content="#0F1011">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="U24">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Roboto subconjuntada a los caracteres que la app puede mostrar.
   Empotrada para que funcione sin cobertura y sin peticiones a terceros. */
@font-face{font-family:Roboto;font-style:normal;font-weight:400;font-display:block;
  src:url(data:font/woff2;base64,__FONT_400__) format('woff2')}
@font-face{font-family:Roboto;font-style:normal;font-weight:500;font-display:block;
  src:url(data:font/woff2;base64,__FONT_500__) format('woff2')}
@font-face{font-family:Roboto;font-style:normal;font-weight:700;font-display:block;
  src:url(data:font/woff2;base64,__FONT_700__) format('woff2')}

:root{
  --bg:#0F1011;
  --surface:#17181A;
  --field:#1B1D1F;
  --border:#2B2E31;
  --rule:#212325;
  --accent:#FFC72C;
  --accent-soft:rgba(255,199,44,.12);
  --accent-line:rgba(255,199,44,.30);
  --text:#F2F3F4;
  --muted:#9A9EA3;
  --faint:#8E9398;
  --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--text);
  height:100vh;height:100dvh;
  display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;
  font-family:Roboto,system-ui,sans-serif;
  font-size:16px;line-height:1.25;
  -webkit-font-smoothing:antialiased;
}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/*Cabecera; Emblema, buscador y rótulo. Único bloque siempre en pantalla.*/
.head{
  z-index:10;
  background:var(--bg);
  padding-top:env(safe-area-inset-top);
  border-bottom:1px solid var(--border);
}
.bar{
  display:grid;grid-template-columns:36px minmax(0,1fr);
  align-items:center;gap:8px;padding:5px 10px 4px;
}
.bar .mark{flex:none;width:34px;height:34px;display:block}
.stack{flex:1;min-width:0}
/* Rótulo del operativo en curso. */
.sub{
  margin:2px 1px 0;padding:0;
  font-size:8px;font-weight:500;letter-spacing:.075em;
  color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/*Buscador*/
.field{
  position:relative;display:flex;align-items:center;
  background:var(--field);
  border:1px solid var(--border);border-radius:8px;
}
.field:focus-within{border-color:#565B61;background:var(--surface)}
.field .lead{
  position:absolute;left:9px;width:15px;height:15px;
  color:var(--faint);pointer-events:none;
}
.field:focus-within .lead{color:var(--faint)}
body.has-back .field .lead{display:none}
#back{
  position:absolute;left:2px;display:grid;place-items:center;
  width:28px;height:28px;padding:0;border:0;border-radius:5px;
  background:none;color:var(--accent);cursor:pointer;
}
#back[hidden]{display:none}
#back .ico{width:20px;height:20px}
#back:focus-visible{outline:1px solid #565B61;outline-offset:-1px}
#q{
  display:block;width:100%;height:34px;
  padding:0 31px 0 32px;
  background:none;border:0;outline:none;border-radius:8px;
  font-family:inherit;font-size:14px;font-weight:500;color:var(--text);
  letter-spacing:.01em;
}
#q::placeholder{color:var(--faint);font-weight:400}
#clear{
  position:absolute;right:2px;
  width:28px;height:28px;display:none;place-items:center;
  background:none;border:0;padding:0;color:var(--muted);cursor:pointer;
}
#clear .ico{width:15px;height:15px}
#clear:active{color:var(--text)}
body.has-query #clear{display:grid}

/*El recuento no se pinta. Se mantiene como región activa para lectores de pantalla.*/
.sr{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/*Lista*/
main{min-height:0;overflow-y:auto;overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}
ul{list-style:none;margin:0;padding:0}

/*Una sola línea cerrada. El separador fino conserva el ritmo sin convertir cada resultado en una tarjeta.*/
.row{
  display:grid;grid-template-columns:56px minmax(0,1fr) 38px;
  align-items:center;column-gap:0;
  min-height:38px;padding:0 7px 0 12px;
  border-bottom:1px solid var(--rule);
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
.row.farola{
  position:relative;
  box-sizing:border-box;
}
.row.farola::before{
  content:"";
  position:absolute;
  inset-inline-start:0;top:50%;
  width:4px;height:22px;
  border-radius:999px;
  background:var(--farola-color);
  transform:translateY(-50%);
  pointer-events:none;
}
.farola-blue{--farola-color:#3B82F6}
.farola-green{--farola-color:#22C55E}
.farola-red{--farola-color:#EF4444}
.farola-yellow{--farola-color:#FACC15}
.row.expanded{background:rgba(255,255,255,.018)}
.row.expanded.farola::before{top:19px}
.group-toggle{
  width:100%;padding:9px 0;margin:-9px 0;
  border:0;background:none;color:inherit;
  font-family:inherit;text-align:left;cursor:pointer;
}
.go.group-map-disabled{color:var(--faint);pointer-events:none}
.go.group-map-disabled .pill{
  background:rgba(142,147,152,.08);border-color:rgba(142,147,152,.22)
}
.group-toggle:focus-visible{
  outline:1px solid #565B61;outline-offset:-1px;border-radius:4px;
}

/*Ancho fijo, para que los nombres se alineen en columna con etiquetas tan dispares como "3", "180–186" o "S/N".*/
.num{
  flex:none;width:auto;
  font-size:12px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  color:var(--accent);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.txt{flex:1;min-width:0;display:block}
.nom{
  display:block;
  font-size:13.5px;line-height:18px;font-weight:500;letter-spacing:.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.detail-toggle{
  width:100%;padding:9px 0;margin:-9px 0;
  border:0;background:none;color:inherit;
  font-family:inherit;text-align:left;cursor:pointer;
}
.detail-toggle:focus-visible{
  outline:1px solid #565B61;outline-offset:-1px;border-radius:4px;
}
.st{
  display:block;margin-top:2.5px;
  font-size:12.5px;line-height:16px;font-weight:400;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/*Coordenadas a la vista, y copiables al tocarlas.*/
/*Los márgenes negativos compensan el relleno, que da un objetivo táctil de 32 px sobre un texto de 16: así la caja ocupa en el flujo lo mismo que una línea de texto y el ritmo vertical no se altera.*/
.co{
  display:block;
  margin:-5.25px 0 -8px -8px;padding:8px;
  background:none;border:0;border-radius:7px;
  font-family:inherit;text-align:left;
  font-size:12px;line-height:16px;font-weight:400;color:var(--faint);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;cursor:pointer;
}
.co:active{color:var(--text)}
.co:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.detail{
  grid-column:1 / -1;
  width:auto;margin:0 8px 6px 68px;padding:0 8px 8px;
  background:rgba(255,255,255,.018);
  border-top:1px solid var(--border);border-radius:0;
  animation:detail-in 160ms ease-out both;
}
.detail-fields{display:grid;gap:4px;margin:0;padding-top:7px}
.detail-item{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px}
.detail-item dt{
  margin:0;color:var(--faint);font-size:9px;line-height:14px;
  font-weight:700;letter-spacing:.055em;text-transform:uppercase;
}
.detail-item dd{
  min-width:0;margin:0;color:var(--text);font-size:11px;line-height:14px;
  overflow-wrap:anywhere;
}
.detail .co{
  width:100%;margin:7px 0 -5px -8px;padding:8px;
  color:var(--accent);font-size:12.5px;
}
/*Plano estático: el fondo opaco permite leer las calles negras del SVG.
  No captura gestos; deslizar sobre él sigue desplazando la lista.*/
.minimap{margin:10px 0 0}
.minimap svg{
  display:block;width:100%;aspect-ratio:5 / 4;max-height:280px;
  background:#ECECE8;border-radius:5px;overflow:hidden;pointer-events:none;
}
.minimap figcaption{margin-top:4px;color:var(--faint);font-size:9px}
.minimap-reference circle{fill:var(--farola-color);stroke:#263039;stroke-width:.3}
.minimap-reference text{
  fill:#17212B;stroke:#FFF;stroke-width:1;paint-order:stroke;
  font-family:Roboto,system-ui,sans-serif;font-size:4.5px;font-weight:700;
  stroke-linejoin:round;
}
.minimap-marker path{fill:#17212B;stroke:#FFF;stroke-width:2.4;stroke-linejoin:round}
.minimap-marker circle{fill:var(--accent)}
.minimap-street{
  fill:none;stroke:#087DB5;stroke-width:3;vector-effect:non-scaling-stroke;
  stroke-linecap:round;stroke-linejoin:round;
}
.minimap-street-halo{stroke:#FFF;stroke-width:6}
.street-detail{margin-left:0;margin-right:0}
.street-detail .minimap{margin-top:7px}
@keyframes detail-in{
  from{opacity:0;transform:translateY(-4px)}
  to{opacity:1;transform:translateY(0)}
}
/*El enlace ocupa la columna completa; la pastilla visible se mantiene discreta para no aumentar la altura de la fila.*/
.go{
  flex:none;width:38px;align-self:stretch;
  display:grid;place-items:center;
  color:var(--accent);text-decoration:none;
}
.pill{
  display:grid;place-items:center;
  width:28px;height:28px;border-radius:7px;
  background:var(--accent-soft);border:1px solid var(--accent-line);
}
.pill .ico{width:14px;height:14px}

/*Las calles conservan la geometría de las filas, pero no enlazan a Maps.*/
.go:active .pill{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.go:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}

/*Separador de coincidencias aproximadas, lo que hay debajo se parece a lo tecleado; no coincide con ello.*/
.sep{
  padding:15px var(--pad) 7px;
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);
  background:var(--bg);
}

/* Sin resultados*/
.empty{padding:30px var(--pad);color:var(--muted);font-size:14px;line-height:1.45}
.empty b{display:block;color:var(--text);font-size:16.5px;font-weight:500;margin-bottom:6px}
.empty[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .detail{animation:none!important}
}
@media (min-width:600px){
  .bar,ul,.empty{max-width:600px;margin-inline:auto}
}
</style>
</head>
<body>

<header class="head">
  <div class="bar">
    __LOGO__
    <div class="stack">
      <div class="field">
        <svg class="ico lead" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7.5"/><path d="M20.5 20.5l-4.2-4.2"/>
        </svg>
        <button id="back" type="button" aria-label="Volver a los grupos" hidden>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
        </button>
        <input id="q" type="text"
               autocomplete="off" autocorrect="off" autocapitalize="off"
               spellcheck="false" inputmode="search" enterkeyhint="search"
               aria-label="Buscar" aria-controls="list" autofocus>
        <button id="clear" type="button" aria-label="Borrar búsqueda">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="sub">__OPERATIVO__</p>
    </div>
  </div>

  <p class="sr" id="meta" role="status" aria-live="polite"></p>
</header>

<main>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden></div>
</main>

<script>
/*Fuse.js, motor de coincidencia aproximada. Se empotra desde src/vendor/ y se envuelve aquí porque el paquete se distribuye como módulo CommonJS: sin este envoltorio no expondría nada a la página.*/
const Fuse = (function(){
  const module = { exports:{} }, exports = module.exports;
  __FUSE__
  return module.exports;
})();

/* Generado desde data.md por scripts/build.py. No editar a mano. */
const LOCATIONS = __LOCATIONS__;
const STREETS = __STREETS__;
const MINIMAP = __MINIMAP__;
const GROUPS = Array.from(LOCATIONS.reduce((groups, loc) => {
  if (!groups.has(loc.menuCode)){
    groups.set(loc.menuCode, {code:loc.menuCode, name:loc.menuName});
  }
  return groups;
}, new Map()).values());

/*Textos visibles. Centralizados para que build.py compruebe que la tipografía subconjuntada cubre todos sus caracteres.*/
const TEXT = {
  approx: 'Quizá buscabas',
  emptyTitle: 'Sin coincidencias',
  emptyBody: 'Comprueba el nombre o la parcela.',
  placeholder: 'Nombre, parcela o calle',
  streets: 'Calles',
  parcel: 'Parcela',
  tradeName: 'Nombre comercial',
  legalName: 'Titular / razón social',
  activity: 'Actividad',
  group: 'Grupo',
  indication: 'Indicación',
  minimap: 'Plano orientativo'
};

/*Etiquetas para lectores de pantalla. No las dibuja la tipografía, así que no entran en la validación de cobertura de build.py.*/
const LABEL = {
  open: 'Ver en el mapa ',
  copy: 'Copiar coordenadas de ',
  copied: 'Coordenadas copiadas',
  openGroup: 'Abrir grupo ',
  minimap: 'Ubicación orientativa en el recinto: ',
  streetMinimap: 'Trazado orientativo de '
};
if (STREETS.length) GROUPS.push({code:'CL', name:TEXT.streets});

/*Ficha de lugar de Google Maps: mapa, punto exacto y accesos a «Cómo llegar» e «Iniciar» dentro de la propia app. Ver docs/03-navegacion-maps.md.*/
const MAPS = 'https://www.google.com/maps/search/?api=1&query=';

/*lucide · map-pin — el destino es un punto en el mapa.*/
const PIN_BODY = 'M20 10.4c0 5.6-8 11.6-8 11.6s-8-6-8-11.6a8 8 0 0 1 16 0Z';
/*lucide · route — el destino es un recorrido.*/
const ROUTE_LINE = 'M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15';
const NS = 'http://www.w3.org/2000/svg';

/*Con menos caracteres, cualquier calle coincide y estorban al teclear.*/
const STREET_MIN_TERM = 3;

/*Coincidencia aproximada: solo actúa cuando la búsqueda literal no devuelve nada. Ver docs/02-datos.md.*/
const FUZZY_MIN_TERM = 3;    // por debajo, cualquier nombre se parece al término
const FUZZY_MAX_SCORE = 0.6; // 0 es idéntico; por encima ya no es una errata
const FUZZY_MAX_RESULTS = 8;

const FUZZY = {
  threshold: 0.4,
  ignoreLocation: true,   // la errata puede estar en cualquier parte del nombre
  minMatchCharLength: 2,  // por encima, una errata parte la coincidencia y se pierde
  includeScore: true
};

const fuse = new Fuse(LOCATIONS, Object.assign({
  keys: ['nameSearch']    // solo nombres; las parcelas se resuelven literalmente
}, FUZZY));

const fuseStreets = STREETS.length
  ? new Fuse(STREETS, Object.assign({ keys: ['search'] }, FUZZY))
  : null;

const q = document.getElementById('q');
const back = document.getElementById('back');
const main = document.querySelector('main');
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const meta = document.getElementById('meta');
const body = document.body;
let expanded = null;
let activeGroup = null;

/**Minúsculas, sin tildes, comillas normalizadas, espacios colapsados.*/
function normalize(s){
  return s.toLowerCase()
    .replace(/[‘’]/g, "'")
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\s+/g, ' ').trim();
}

/**Solo letras y dígitos. Ver flatten() en scripts/build.py: es lo que hace que «A01» encuentre «A-01» aunque falte el guion.*/
function flatten(s){
  return normalize(s).replace(/[^a-z0-9]/g, '');
}

function mapsUrl(loc){
  return MAPS + loc.lat + ',' + loc.lon;
}

/**
* Filtra y ordena.
* Separa calles y ubicaciones, tanto literales como aproximadas, para rotular las sugerencias.
* Llevar la unidad a la ubicación equivocada es el fallo mas grave que esta aplicación puede cometer.
* Consulta literal: empieza por, contiene, y contiene una vez aplanado.
* Solo si nada de eso devuelve resultados se ofrecen aproximaciones.
*/
function search(raw){
  const term = normalize(raw);
  if (!term) return { streets: [], exact: LOCATIONS, approx: [], approxStreets: [] };

  const exact = [], prefix = [], contains = [];

  const flat = flatten(raw);

  const streets = term.length < STREET_MIN_TERM
    ? []
    : STREETS.filter(st => flat && st.flat.includes(flat));

  // Tercer nivel literal: sin espacios ni puntuación, para que un separador de más o de menos no deje la pantalla vacía.
  const loose = [];
  for (const loc of LOCATIONS){
    const i = loc.search.indexOf(term);
    if (i === 0) prefix.push(loc);
    else if (i > 0) contains.push(loc);
    else if (flat && loc.flat.includes(flat)) loose.push(loc);
  }

  const literal = prefix.concat(contains, loose);
  const nada = !literal.length && !streets.length;
  if (!nada || term.length < FUZZY_MIN_TERM) return { streets, exact: literal, approx: [], approxStreets: [] };

  // Respaldo aproximado: también sobre las calles, no solo sobre los nombres.
  const approxStreets = fuseStreets
    ? fuseStreets.search(term)
        .filter(r => r.score <= FUZZY_MAX_SCORE)
        .map(r => r.item)
    : [];

  const approx = fuse.search(term)
    .filter(r => r.score <= FUZZY_MAX_SCORE)
    .slice(0, FUZZY_MAX_RESULTS)
    .map(r => r.item);

  return { streets: [], exact: [], approx, approxStreets };
}

const unit = n => n + (n === 1 ? ' ubicación' : ' ubicaciones');
const streetUnit = n => n + (n === 1 ? ' calle' : ' calles');

/**Icono SVG de trazo a partir de una o varias rutas.*/
function icon(cls, ...paths){
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', cls);
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  for (const d of paths){
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    svg.append(path);
  }
  return svg;
}

function pinIcon(){
  const svg = icon('ico', PIN_BODY);
  const dot = document.createElementNS(NS, 'circle');
  dot.setAttribute('cx', '12');
  dot.setAttribute('cy', '10.2');
  dot.setAttribute('r', '2.9');
  svg.append(dot);
  return svg;
}

function minimap(loc){
  const figure = document.createElement('figure');
  figure.className = 'minimap';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', loc.mapView.join(' '));
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', loc.mapPath
    ? LABEL.streetMinimap + loc.name
    : LABEL.minimap + loc.name + ', ' + loc.label);

  const image = document.createElementNS(NS, 'image');
  const [x, y, width, height] = MINIMAP.bounds;
  image.setAttribute('x', x);
  image.setAttribute('y', y);
  image.setAttribute('width', width);
  image.setAttribute('height', height);
  image.setAttribute('href', MINIMAP.image);
  svg.append(image);

  if (loc.mapPath){
    // La calle solo se dibuja sobre el plano, sin convertirla en un destino GPS.
    for (const cls of ['minimap-street minimap-street-halo', 'minimap-street']){
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('class', cls);
      path.setAttribute('d', loc.mapPath);
      svg.append(path);
    }
  }

  // Las referencias salen del mismo catálogo que la lista, no de otra tabla GPS.
  for (const reference of LOCATIONS){
    if (!reference.marker || !reference.mapPoint) continue;
    const [rx, ry] = reference.mapPoint;
    const group = document.createElementNS(NS, 'g');
    group.setAttribute('class', 'minimap-reference farola-' + reference.marker);
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('cx', rx);
    dot.setAttribute('cy', ry);
    dot.setAttribute('r', '1.2');
    const label = document.createElementNS(NS, 'text');
    const left = reference.marker === 'blue';
    label.setAttribute('x', rx + (left ? -2.5 : 2.5));
    label.setAttribute('y', ry + 1.5);
    label.setAttribute('text-anchor', left ? 'end' : 'start');
    label.textContent = reference.label;
    group.append(dot, label);
    svg.append(group);
  }

  if (loc.mapPoint){
    // La punta, no el centro del icono, coincide con las coordenadas del destino.
    const marker = document.createElementNS(NS, 'g');
    marker.setAttribute('class', 'minimap-marker');
    marker.setAttribute('transform', 'translate(' + loc.mapPoint.join(' ') + ') scale(.45) translate(-12 -22)');
    const pin = document.createElementNS(NS, 'path');
    pin.setAttribute('d', PIN_BODY);
    const center = document.createElementNS(NS, 'circle');
    center.setAttribute('cx', '12');
    center.setAttribute('cy', '10.2');
    center.setAttribute('r', '3.5');
    marker.append(pin, center);
    svg.append(marker);
  }

  const caption = document.createElement('figcaption');
  caption.textContent = TEXT.minimap;
  figure.append(svg, caption);
  return figure;
}

function detail(loc){
  const panel = document.createElement('div');
  panel.className = 'detail';
  panel.id = 'detail-' + loc.id;

  if (loc.mapPath){
    panel.classList.add('street-detail');
    panel.append(minimap(loc));
    return panel;
  }

  const fields = document.createElement('dl');
  fields.className = 'detail-fields';
  const values = [
    [TEXT.parcel, loc.label],
    [TEXT.tradeName, loc.tradeName],
    [TEXT.legalName, loc.legalName],
    [TEXT.activity, loc.activityType],
    [TEXT.group, loc.group],
    [TEXT.indication, loc.street]
  ];
  for (const [label, value] of values){
    if (!value) continue;
    const item = document.createElement('div');
    item.className = 'detail-item';
    const term = document.createElement('dt');
    term.textContent = label;
    const description = document.createElement('dd');
    description.textContent = value;
    item.append(term, description);
    fields.append(item);
  }

  const coordinates = document.createElement('button');
  coordinates.className = 'co';
  coordinates.type = 'button';
  coordinates.dataset.coords = loc.lat + ',' + loc.lon;
  coordinates.textContent = loc.lat + ', ' + loc.lon;
  coordinates.setAttribute('aria-label', LABEL.copy + loc.name);
  panel.append(fields, coordinates);
  if (loc.mapPoint) panel.append(minimap(loc));
  return panel;
}

function closeDetail(options = {}){
  if (!expanded) return;
  const current = expanded;
  expanded = null;
  current.button.setAttribute('aria-expanded', 'false');
  current.li.classList.remove('expanded');
  current.panel.remove();
  if (options.restoreFocus) current.button.focus();
}

function openDetail(li, button, loc){
  if (expanded && expanded.button === button){
    closeDetail({restoreFocus:false});
    return;
  }
  closeDetail({restoreFocus:false});
  const panel = detail(loc);
  li.append(panel);
  li.classList.add('expanded');
  button.setAttribute('aria-expanded', 'true');
  expanded = {li, button, panel};
}

function row(loc){
  const li = document.createElement('li');
  li.className = 'row';
  if (loc.marker) li.classList.add('farola', 'farola-' + loc.marker);

  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = loc.display;

  const nom = document.createElement('button');
  nom.className = 'nom detail-toggle';
  nom.type = 'button';
  nom.textContent = loc.name;
  nom.dataset.locationId = loc.id;
  nom.setAttribute('aria-expanded', 'false');
  nom.setAttribute('aria-controls', 'detail-' + loc.id);

  const txt = document.createElement('span');
  txt.className = 'txt';
  txt.append(nom);

  const pill = document.createElement('span');
  pill.className = 'pill';
  pill.append(pinIcon());

  // Único enlace externo de la fila; el nombre solo abre el detalle.
  const a = document.createElement('a');
  a.className = 'go';
  a.href = mapsUrl(loc);
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  const mapLabel = LABEL.open + loc.name + ', ubicación ' + loc.label;
  a.setAttribute('aria-label', loc.street ? mapLabel + ', ' + loc.street : mapLabel);
  a.append(pill);

  li.append(num, txt, a);
  return li;
}

function groupRow(group){
  const li = document.createElement('li');
  li.className = 'row';

  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = group.code;

  const button = document.createElement('button');
  button.className = 'nom group-toggle';
  button.type = 'button';
  button.dataset.group = group.code;
  button.textContent = group.name;
  button.setAttribute('aria-label', LABEL.openGroup + group.name);

  const txt = document.createElement('span');
  txt.className = 'txt';
  txt.append(button);

  const pill = document.createElement('span');
  pill.className = 'pill';
  pill.append(pinIcon());

  const disabledMap = document.createElement('span');
  disabledMap.className = 'go group-map-disabled';
  disabledMap.setAttribute('aria-hidden', 'true');
  disabledMap.append(pill);

  li.append(num, txt, disabledMap);
  return li;
}

/**Calle desplegable: conserva las columnas, sin parcela ni enlace de ubicación.*/
function streetRow(st){
  const li = document.createElement('li');
  li.className = 'row route';

  const num = document.createElement('span');
  num.className = 'num';

  const nom = document.createElement('button');
  nom.className = 'nom detail-toggle';
  nom.type = 'button';
  nom.textContent = st.name;
  nom.dataset.streetId = st.id;
  nom.setAttribute('aria-expanded', 'false');
  nom.setAttribute('aria-controls', 'detail-' + st.id);

  const txt = document.createElement('span');
  txt.className = 'txt';
  txt.append(nom);

  const pill = document.createElement('span');
  pill.className = 'pill';
  pill.append(icon('ico', ROUTE_LINE, 'M6 16.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z',
                    'M18 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z'));

  const disabledMap = document.createElement('span');
  disabledMap.className = 'go group-map-disabled';
  disabledMap.setAttribute('aria-hidden', 'true');
  disabledMap.append(pill);

  li.append(num, txt, disabledMap);
  return li;
}

function separator(){
  const li = document.createElement('li');
  li.className = 'sep';
  li.setAttribute('aria-hidden', 'true');
  li.textContent = TEXT.approx;
  return li;
}

function render(result){
  setHeaderBack(true);
  const frag = document.createDocumentFragment();
  for (const st of result.streets) frag.append(streetRow(st));
  for (const loc of result.exact) frag.append(row(loc));
  if (result.approx.length || result.approxStreets.length){
    frag.append(separator());
    for (const street of result.approxStreets) frag.append(streetRow(street));
    for (const loc of result.approx) frag.append(row(loc));
  }
  list.replaceChildren(frag);

  const total = result.streets.length + result.exact.length + result.approx.length + result.approxStreets.length;
  empty.hidden = total > 0;

  const counts = [];
  if (result.streets.length) counts.push(streetUnit(result.streets.length));
  if (result.exact.length) counts.push(unit(result.exact.length));
  if (result.approxStreets.length) counts.push(streetUnit(result.approxStreets.length) + ' ' + TEXT.approx.toLowerCase());
  if (result.approx.length) counts.push(unit(result.approx.length) + ' ' + TEXT.approx.toLowerCase());
  meta.textContent = counts.join(' · ') || TEXT.emptyTitle;
}

function renderGroups(){
  setHeaderBack(false);
  const frag = document.createDocumentFragment();
  for (const group of GROUPS) frag.append(groupRow(group));
  list.replaceChildren(frag);
  empty.hidden = GROUPS.length > 0;
  meta.textContent = GROUPS.length + (GROUPS.length === 1 ? ' grupo' : ' grupos');
}

function renderGroup(groupCode){
  setHeaderBack(true);
  const locations = LOCATIONS.filter(loc => loc.menuCode === groupCode);
  const streets = groupCode === 'CL' ? STREETS : [];
  const frag = document.createDocumentFragment();
  for (const loc of locations) frag.append(row(loc));
  for (const street of streets) frag.append(streetRow(street));
  list.replaceChildren(frag);
  empty.hidden = true;
  meta.textContent = streets.length ? streetUnit(streets.length) : unit(locations.length);
}

function setHeaderBack(visible){
  back.hidden = !visible;
  body.classList.toggle('has-back', visible);
}

function update(){
  closeDetail({restoreFocus:false});
  main.scrollTop = 0;
  const v = q.value;
  body.classList.toggle('has-query', v.length > 0);
  if (!normalize(v)){
    if (activeGroup) renderGroup(activeGroup);
    else renderGroups();
    return;
  }
  activeGroup = null;
  render(search(v));
}

/**Copia al portapapeles. El API moderno solo existe en contextos seguros (https o localhost); si la app se abre desde un archivo o por http, se recurre al método antiguo, que sigue funcionando en todos los navegadores.*/
function copyText(text){
  if (navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-100px;opacity:0';
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    ok ? resolve() : reject(new Error('copy'));
  });
}

/**La confirmación se anuncia por la región de estado, sin cambiar el texto visible de las coordenadas. */
list.addEventListener('click', e => {
  const group = e.target.closest('.group-toggle');
  if (group){
    closeDetail({restoreFocus:false});
    activeGroup = group.dataset.group;
    renderGroup(activeGroup);
    main.scrollTop = 0;
    back.focus({preventScroll:true});
    return;
  }
  const toggle = e.target.closest('.detail-toggle');
  if (toggle){
    const li = toggle.closest('.row');
    const loc = toggle.dataset.streetId
      ? STREETS.find(item => item.id === toggle.dataset.streetId)
      : LOCATIONS.find(item => item.id === toggle.dataset.locationId);
    if (li && loc) openDetail(li, toggle, loc);
    return;
  }
  const btn = e.target.closest('.co');
  if (!btn) return;
  copyText(btn.dataset.coords).then(() => {
    meta.textContent = LABEL.copied;
  }).catch(() => {});
});

document.addEventListener('click', e => {
  if (expanded && !expanded.li.contains(e.target)){
    closeDetail({restoreFocus:false});
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && expanded){
    e.preventDefault();
    closeDetail({restoreFocus:true});
  }
});

q.addEventListener('input', update);
q.addEventListener('search', update);
back.addEventListener('click', () => {
  const previousGroup = activeGroup;
  activeGroup = null;
  q.value = '';
  update();
  const group = previousGroup
    ? list.querySelector('[data-group="' + previousGroup + '"]')
    : list.querySelector('.group-toggle');
  if (group) group.focus({preventScroll:true});
});
document.getElementById('clear').addEventListener('click', () => {
  q.value = '';
  update();
  q.focus();
});
q.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (expanded){
    e.preventDefault();
    closeDetail({restoreFocus:true});
    return;
  }
  q.value = '';
  update();
});

q.placeholder = TEXT.placeholder;

const emptyTitle = document.createElement('b');
emptyTitle.textContent = TEXT.emptyTitle;
empty.append(emptyTitle, document.createTextNode(TEXT.emptyBody));

update();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
